# BIG-IP Malicious User — default lab config
# Consumed by scripts/render_irule.py (template placeholders), lib/scoring.py, iRulesLX.
# Secrets (Google AI key, BIG-IP credentials) stay out of this file — use .env / BIG-IP secrets.

logging:
  enabled: true
  prefix: "malicious_user"

session:
  table_prefix: "mu:"
  timeout_seconds: 3600

# --- Identity -----------------------------------------------------------------
identity:
  mode: ip                 # ip | jwt_sub | cookie_header
  jwt:
    header: Authorization  # Bearer <token>
    claim: sub
  cookie_header:
    name: ""               # cookie name when mode=cookie_header
  header_name: ""          # custom header when mode uses header fallback
  allowlist_subs: []       # jwt sub / roles attenuated or skipped
  allowlist_attenuation: 0.25

# --- Classic abuse signals (XC-like) ------------------------------------------
signals:
  failed_login:
    enabled: true
    paths:
      - /login
      - /api/auth/login
      - /api/v1/login
    status_codes: [401]
    include_403: false
    points: 10

  waf_activity:
    enabled: true
    points_per_violation: 12

  forbidden_activity:
    enabled: true
    points: 15

  rate_limiting:
    enabled: true
    window_seconds: 60
    threshold_requests: 120
    points: 8

  ip_reputation:
    enabled: false
  bot_defense:
    enabled: false

# --- IDOR / data-aspiration features ------------------------------------------
idor:
  enabled: true
  window_seconds: 180
  daily_cap_enabled: true
  distinct_cap: 500

  object_path_templates:
    - /api/accounts/{id}
    - /api/users/{id}
    - /api/resources/{id}
  object_path_patterns:
    - ^/api/accounts/[^/]+$
    - ^/api/users/[^/]+$
    - ^/api/resources/[^/]+$
    - ^/api/.+/\d+$
    - ^/api/.+/[0-9a-fA-F-]{8,}$

  distinct_ids_threshold: 25
  distinct_ids_high: 40
  sequential_ratio_threshold: 0.6
  template_focus_threshold: 0.7
  success_enum_threshold: 20
  success_min_200_ratio: 0.7
  forbid_ratio_threshold: 0.4
  forbid_min_samples: 10
  response_bytes_threshold: 5242880   # 5 MiB warn
  response_bytes_high: 26214400       # 25 MiB
  ids_per_minute_mult: 10

  baseline:
    distinct_object_ids_p95: 8
    response_bytes_mb_p95: 5

  weights:
    distinct_ids: 0.30
    rate: 0.15
    sequential_ratio: 0.20
    template_focus: 0.15
    bytes: 0.20

  aspiration_points_scale: 40
  aspiration_threshold: 0.55
  ids_per_minute: 20

# --- Threat score & cooling-off -----------------------------------------------
scoring:
  points:
    forbidden_activity: 15
    failed_login: 10
    waf_hit: 12
    rate_limit: 8
    distinct_object_ids: 20
    sequential_ratio: 15
    forbid_ratio: 18
    success_enum: 22
    template_focus: 10
    response_bytes: 8
  thresholds:
    low: 30
    medium: 60
    high: 90
  max_score: 200
  cooling_off_minutes: 20
  cooling_off_decay_points: 15

# --- Mitigation ---------------------------------------------------------------
mitigation:
  shadow: true                     # true = log only, no challenge/block
  low: js_challenge
  medium: hard_challenge
  high: temp_block
  high_aspiration: rate_limit_then_block
  low_challenge:
    cookie_name: mu_chal_l
    ttl_seconds: 300
  medium_challenge:
    cookie_name: mu_chal_m
    ttl_seconds: 600
    delay_ms: 1500
  high_prefer_rate_limit: true
  high_rate_limit_tps: 2
  temp_block_ttl_seconds: 900
  rate_limit:
    enabled: true
    requests_per_minute: 10
    object_requests_per_minute: 30

# --- Google AI (Gemini) enrich (iRulesLX) — gated, fail-open ------------------
ai:
  enabled: true
  provider: google
  model: gemini-2.5-flash
  mode: enrich                     # enrich | dual_judge
  endpoint: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
  timeout_ms: 800
  fail_open: true
  gate:
    ambiguous_min: 25
    ambiguous_max: 55
    sample_percent: 5
    skip_if_high: true

  identity: jwt_sub
  action: shadow                   # enforce | shadow

  privacy:
    hash_ids: true
    local_only_llm: false
    local_endpoint: ""

  context:
    path_allowlist: true
    openapi_hints: false
    openapi_spec_path: ""

  features:
    response_status_seq: true
    cross_account_hint: false

  memory:
    campaign_summary: false

  calibration:
    feedback: false

  options:
    suggest_asm: false
    dual_judge: false

# --- Optional WAF-assisted hardening ------------------------------------------
waf_assisted:
  enabled: false
  notes: >
    DoS/rate on object templates, OpenAPI enforcement, Bot Defense, SIEM on
    volume-200 — useful hardening, insufficient alone for auth+IDOR dump.

# --- Deploy targets (scripts/deploy_rest.py) ----------------------------------
deploy:
  partition: Common
  irule_name: malicious_user
  lx_plugin_name: ai_enrich
